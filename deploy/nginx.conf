# Phonebook — single public URL via Nginx reverse proxy.
#
#   http://localhost:8080/               -> Vue frontend  (127.0.0.1:5173)
#   http://localhost:8080/api/...        -> Express API   (127.0.0.1:3000)
#
# Test the file, then reload:
#   nginx -t -c /path/to/nginx.conf
#   nginx -s reload
#
# For public HTTPS, terminate TLS on this block (listen 443 ssl + certs) and
# keep the same two locations. SQL Server is never routed here.

events {}

http {
    access_log off;

    upstream phonebook_frontend {
        server 127.0.0.1:5173;
    }

    upstream phonebook_backend {
        server 127.0.0.1:3000;
    }

    server {
        listen 8080;

        # Backend JSON API (prefix is preserved: /api/contacts -> backend /api/contacts)
        location /api/ {
            proxy_pass http://phonebook_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vue frontend (websocket headers keep Vite HMR working in dev)
        location / {
            proxy_pass http://phonebook_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
